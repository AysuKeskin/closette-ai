# Standalone production stack: docker compose --env-file .env.production -f compose.production.yml up -d --build
services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_HOST: ${API_HOST:?set the public API hostname}
      STORAGE_HOST: ${STORAGE_HOST:?set the public storage hostname}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 172.29.83.2
    depends_on: [backend, minio]
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: closette
      POSTGRES_USER: closette
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a random production password}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closette"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set a random Redis password}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes: ["redisdata:/data"]
  minio:
    # Docker Hub refuses the pull; quay.io is where MinIO publishes now. Pinned so
    # a redeploy cannot silently move the storage server under the data.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set storage access key}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set a random storage password}
    volumes: ["images:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; mc mb --ignore-existing local/wardrobe; mc mb --ignore-existing local/beauty'
  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      APP_ENV: production
      AI_PROVIDER: ${AI_PROVIDER:?choose an AI provider}
      VLM_API_KEY: ${VLM_API_KEY:?set the provider key}
      VLM_MODEL: ${VLM_MODEL:?pin the provider model}
      VLM_BASE_URL: ${VLM_BASE_URL:-}
      VLM_FALLBACK_TO_MOCK: "false"
      SEG_PROVIDER: none
      EMBED_PROVIDER: ${EMBED_PROVIDER:-mock}
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      redis: { condition: service_started }
      ai-service: { condition: service_started }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      MINIO_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: https://${STORAGE_HOST:?required}
      STORAGE_REGION: us-east-1
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?set a random JWT secret}
      JWT_ACCESS_TTL_MINUTES: 15
      RATE_LIMIT_MODE: enforce
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_PROVIDER: ${AI_PROVIDER:?required}
      AI_PRIVACY_URL: ${AI_PRIVACY_URL:?set the provider privacy policy URL}
      AI_PROCESSING_DETAILS: ${AI_PROCESSING_DETAILS:?describe provider region, retention and training use}
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: ${RESEND_API_KEY:?required}
      EMAIL_FROM: ${EMAIL_FROM:?use your verified email domain}
      PUBLIC_BASE_URL: https://${API_HOST:?required}
      PRIVACY_OPERATOR: ${PRIVACY_OPERATOR:?set the legal operator name}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:?set a monitored support address}
      INFRASTRUCTURE_DETAILS: ${INFRASTRUCTURE_DETAILS:?describe hosting, region and email processors}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:?match the actual backup lifecycle}
networks:
  default:
    ipam:
      config: [{ subnet: 172.29.83.0/24 }]
volumes:
  pgdata:
  redisdata:
  images:
  caddy_data:
  caddy_config:
