# Local development only. Compose loads this automatically, so `docker compose up`
# on a laptop still exposes the AI service's docs at http://localhost:8000/docs.
#
# CI and production run `docker compose -f docker-compose.yml …`, which skips this
# file — there the service is reachable only from the backend, so the rate limits
# in front of it cannot be walked around.
services:
  ai-service:
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8000}:8000"
