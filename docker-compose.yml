services:
  postgres:
    # pgvector image = postgres:16 + the `vector` extension (for visual similarity).
    image: pgvector/pgvector:pg16
    container_name: closette-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-closette}
      POSTGRES_USER: ${POSTGRES_USER:-closette}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-closette}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - closette_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-closette}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: closette-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO stopped publishing to Docker Hub, which now refuses the pull outright.
    # quay.io is where the releases live; the tag is pinned so CI and a laptop get
    # the same server rather than whatever `latest` points at that day.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: closette-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-closette}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-closette123}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - closette_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the required buckets on startup, then exits.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: closette-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-closette} ${MINIO_ROOT_PASSWORD:-closette123};
      mc mb --ignore-existing local/wardrobe;
      mc mb --ignore-existing local/beauty;
      echo 'Buckets ready';
      exit 0;
      "

  ai-service:
    profiles: ["app"]
    build:
      context: ./ai-service
    container_name: closette-ai-service
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      VLM_API_KEY: ${VLM_API_KEY:-}
      VLM_MODEL: ${VLM_MODEL:-}
      VLM_BASE_URL: ${VLM_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      SEG_PROVIDER: ${SEG_PROVIDER:-none}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-mock}
    # Deliberately not published: only the backend needs to reach this, and every
    # quota lives in the backend. A published port is a way around all of them.
    # docker-compose.override.yml opens it again for local development.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    profiles: ["app"]
    build:
      context: ./backend
    container_name: closette-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-closette}
      POSTGRES_USER: ${POSTGRES_USER:-closette}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-closette}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-closette}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-closette123}
      MINIO_BUCKET_WARDROBE: ${MINIO_BUCKET_WARDROBE:-wardrobe}
      MINIO_BUCKET_BEAUTY: ${MINIO_BUCKET_BEAUTY:-beauty}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      # log counts what would have been refused; enforce refuses it.
      USAGE_MODE: ${USAGE_MODE:-log}
      AI_PRIVACY_URL: ${AI_PRIVACY_URL:-}
      AI_PROCESSING_DETAILS: ${AI_PROCESSING_DETAILS:-Local development}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      JWT_SECRET: ${JWT_SECRET:?set a real JWT_SECRET in .env — the app refuses to start without one}
      # Without these the container falls back to provider=log and silently sends
      # nothing: backend/.env is a local-development file and is not in the image.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Closette <onboarding@resend.dev>}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-60}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"

volumes:
  closette_pgdata:
  closette_miniodata:
