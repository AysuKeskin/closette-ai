services:
  postgres:
    image: postgres:16-alpine
    container_name: closette-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-closette}
      POSTGRES_USER: ${POSTGRES_USER:-closette}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-closette}
    ports:
      - "5432:5432"
    volumes:
      - closette_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-closette}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: closette-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: closette-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-closette}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-closette123}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - closette_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the required buckets on startup, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: closette-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-closette} ${MINIO_ROOT_PASSWORD:-closette123};
      mc mb --ignore-existing local/wardrobe;
      mc mb --ignore-existing local/beauty;
      echo 'Buckets ready';
      exit 0;
      "

  ai-service:
    profiles: ["app"]
    build:
      context: ./ai-service
    container_name: closette-ai-service
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      SEG_PROVIDER: ${SEG_PROVIDER:-none}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-mock}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    profiles: ["app"]
    build:
      context: ./backend
    container_name: closette-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-closette}
      POSTGRES_USER: ${POSTGRES_USER:-closette}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-closette}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-closette}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-closette123}
      MINIO_BUCKET_WARDROBE: ${MINIO_BUCKET_WARDROBE:-wardrobe}
      MINIO_BUCKET_BEAUTY: ${MINIO_BUCKET_BEAUTY:-beauty}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-256-bits-long-000000}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-60}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  closette_pgdata:
  closette_miniodata:
