plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ai.closette'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Patch releases ahead of what the Spring Boot BOM pins, each one closing a
// CRITICAL/HIGH the CI image scan gates on. Raise them when the BOM catches up;
// removing them re-opens the vulnerability.
ext {
    set('tomcat.version', '10.1.59')
    set('netty.version', '4.1.138.Final')
    set('postgresql.version', '42.7.12')
}

dependencies {
    // Web + validation
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux' // WebClient for AI service

    // Persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Security + JWT
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Redis (rate limiting / sessions)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Object storage (MinIO / S3-compatible)
    implementation 'io.minio:minio:8.6.0'
    // MinIO drags in an older BouncyCastle than its CVEs allow.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'

    // API docs
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Loads a local .env (git-ignored) into the Spring Environment — keeps secrets
    // (e.g. RESEND_API_KEY) out of the repo, like the AI service's .env.
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // Dev
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
