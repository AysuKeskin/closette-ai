spring:
  datasource:
    url: jdbc:h2:mem:closette;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

closette:
  ratelimit:
    mode: log
  jwt:
    secret: test-secret-that-is-definitely-long-enough-for-hs256-0123456789
    access-ttl-minutes: 60
    refresh-ttl-days: 30
  ai:
    # Unreachable on purpose: tests are isolated from any running AI service and
    # exercise the deterministic rule-based fallbacks (not a live LLM).
    base-url: http://localhost:1
  storage:
    cleanup-delay-ms: 3600000
    reconcile-delay-ms: 3600000
    endpoint: http://localhost:9000
    access-key: test
    secret-key: test12345
    bucket-wardrobe: wardrobe
    bucket-beauty: beauty
