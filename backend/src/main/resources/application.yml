server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: closette-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:closette}
    username: ${POSTGRES_USER:closette}
    password: ${POSTGRES_PASSWORD:closette}
  jpa:
    hibernate:
      ddl-auto: none  # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

closette:
  privacy:
    operator: ${PRIVACY_OPERATOR:Closette (development)}
    support-email: ${SUPPORT_EMAIL:}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    ai-provider: ${AI_PROVIDER:mock}
    ai-privacy-url: ${AI_PRIVACY_URL:}
    ai-processing-details: ${AI_PROCESSING_DETAILS:Local development mock; no external AI transfer.}
    infrastructure-details: ${INFRASTRUCTURE_DETAILS:Local development storage.}
    backup-retention-days: ${BACKUP_RETENTION_DAYS:30}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-256-bits-long-000000}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:60}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
  beauty:
    # Optional RapidAPI source (e.g. Sephora). Left blank = skipped; the free
    # Makeup API + Open Beauty Facts sources always run.
    rapidapi-key: ${RAPIDAPI_KEY:}
    rapidapi-host: ${RAPIDAPI_HOST:sephora.p.rapidapi.com}
    # The search endpoint differs per listing — /products/list?q= on some,
    # /search-by-keyword?query= on others. Configurable so switching listings
    # is an env change, not a code change; a wrong path just returns nothing.
    rapidapi-search-path: ${RAPIDAPI_SEARCH_PATH:/products/list}
    rapidapi-query-param: ${RAPIDAPI_QUERY_PARAM:q}
  email:
    # log (dev, codes to the console) | resend (real email, free tier)
    provider: ${EMAIL_PROVIDER:log}
    resend-api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:Closette <onboarding@resend.dev>}
    timeout-ms: 20000
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${MINIO_ROOT_USER:closette}
    secret-key: ${MINIO_ROOT_PASSWORD:closette123}
    bucket-wardrobe: ${MINIO_BUCKET_WARDROBE:wardrobe}
    bucket-beauty: ${MINIO_BUCKET_BEAUTY:beauty}
    signed-url-ttl-minutes: 60
  ratelimit:
    mode: ${RATE_LIMIT_MODE:enforce}
    # Per-user budgets are the real control: they bound what one account can spend.
    user:            { per-minute: 50,  per-day: 288, per-week: 900 }
    unverified-user: { per-minute: 20,  per-day: 30,  per-week: 60 }
    verify-code:     { per-minute: 5,   per-day: 20,  per-week: 40 }
    # Per-IP budgets guard the signed-out endpoints, where there is no account yet.
    # They are flood brakes, not rations: a Turkish mobile carrier puts thousands of
    # real subscribers behind one address, so anything sized for a household turns
    # away genuine people long before it inconveniences a script. What actually
    # makes a fake account expensive is the verified email it needs.
    register-ip:     { per-minute: 15,  per-day: 150,  per-week: 500 }
    login-ip:        { per-minute: 20,  per-day: 2000, per-week: 6000 }
    login-email:     { per-minute: 5,   per-day: 50,   per-week: 150 }
    password-reset-ip:    { per-minute: 10, per-day: 100, per-week: 300 }
    password-reset-email: { per-minute: 1,  per-day: 5,   per-week: 15 }

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

logging:
  level:
    ai.closette: DEBUG
