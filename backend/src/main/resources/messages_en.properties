validation.username.pattern=Username must be 3-30 characters, using letters, numbers, . or _
validation.password.blank=Password must not be blank
validation.password.pattern=Password must be 8+ characters with an uppercase, a lowercase, and a number
validation.code.required=Enter the 6-digit code
validation.code.sixDigits=The code is 6 digits
validation.displayName.tooLong=Display name is too long

