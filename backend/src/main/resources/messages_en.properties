# ---- Should I buy this? ----
# {0} = how many of the candidate's tags are already owned, {1} = how many it has
buy.unreadable=I couldn''t tell what that is. Try describing the clothing piece, like "a beige oversized blazer".
buy.wardrobeEmpty=Your wardrobe is empty, so there''s nothing to compare against yet.
buy.noTags=Tell me its colours and style for a sharper read.
buy.fit.good=This fits your style well — {0} of its {1} colour/style tags are already in your closet.
buy.fit.partial=This partly fits your style — {0} of its {1} colour/style tags are already in your closet.
buy.fit.low=This doesn''t match your palette much — only {0} of its {1} colour/style tags are in your closet.
# {0} = count, {1} = per-category breakdown such as "2 tops, 1 bottom"
buy.pairsWith.one=It pairs with {0} item you own ({1}).
buy.pairsWith.other=It pairs with {0} items you own ({1}).
buy.alreadyOwn.one=You already own {0} similar {1}.
buy.alreadyOwn.other=You already own {0} similar {1}.
buy.label.fallback=this item

# ---- Get Ready ----
outfit.firstLook.title=Your first look
outfit.firstLook.rationale=Add a few pieces to your wardrobe and I''ll put a complete look together for you.
outfit.defaultTitle=Your look
outfit.defaultOccasion=your day
outfit.retryTitle=Let''s try again
outfit.unclearOccasion=I couldn''t tell what to style for that. Try a clearer occasion, like "dinner with friends".
outfit.ruleBased.title=Look 1
# {0} = the occasion, {1} = how many pieces the look uses
outfit.ruleBased.rationale=A complete look for {0}, built from {1} pieces you already own.
outfit.aiFallbackRationale=A complete look for {0}.
# {0} = the user's colour season, e.g. "Autumn"
outfit.colorSeasonHint=flattering colours for a {0} colour season

# ---- Emails ----
# Sent while the request is still in flight, so they land in the language the
# user signed up in. The markup lives in ResendEmailSender; only prose is here.
email.verify.subject=Verify your Closette email
email.verify.greeting=Welcome to Closette 🎀
email.verify.intro=Your verification code is:
email.reset.subject=Reset your Closette password
email.reset.intro=You asked to reset your password.
email.reset.code=Your code is:
email.reset.ignore=If this wasn''t you, ignore this email.
email.expiry=It expires in 15 minutes.
