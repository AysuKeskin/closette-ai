# User-facing text, English. The Turkish bundle must carry exactly the same keys
# (MessageBundleTest enforces it).
#
# A key prefixed with a field name (email:, username:, code:) keeps that prefix
# untranslated: the mobile client splits on it to place the message under the
# right input. Only the text after the colon is language.

# ---- Errors ----
error.auth.required=Please sign in to continue
error.auth.invalidCredentials=Invalid email or password
error.auth.invalidRefreshToken=Invalid or expired refresh token
error.auth.emailTaken=email: An account with this email already exists
error.auth.usernameTaken=username: This username is already taken
error.auth.emailAlreadyVerified=Your email is already verified
error.auth.codeExpired=code: This code has expired — request a new one
error.auth.codeIncorrect=code: That code is incorrect
error.auth.tooManyAttempts=code: Too many wrong codes — request a new one
error.auth.resendCooldown=Please wait a moment before requesting another code
error.auth.emailNotVerified=Verify your email to use the shopping assistant

error.user.notFound=User not found
error.item.notFound=Item not found
error.outfit.notFound=Outfit not found
error.beauty.notFound=Beauty item not found
error.wishlist.notFound=Wishlist item not found

error.image.required=An image is required
error.image.unreadable=Could not read the uploaded image
error.storage.uploadFailed=Could not store the image

error.ingredient.required=That doesn''t look like an ingredient name
error.ai.unavailable=AI analysis is temporarily unavailable
error.ai.unavailableAddManually=AI analysis is temporarily unavailable. You can add this item manually.

error.forbidden=You don''t have access to this resource
error.internal=Something went wrong
error.rateLimitExceeded=You''ve used up your AI quota for now — it refreshes shortly
error.tooManyRequests=Too many attempts — please wait a moment and try again
error.validation.invalidRequest=Invalid request

